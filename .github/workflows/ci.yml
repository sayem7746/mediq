name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_PATH: ./data/mediq.ci.sqlite
      SESSION_SECRET: test-session-secret-min-32-chars!
      STAFF_BOOTSTRAP_EMAIL: staff@example.com
      STAFF_BOOTSTRAP_PASSWORD: test-bootstrap-password
      ANALYTICS_ENABLED: "false"
      GENERAL_LAUNCH_ENABLED: "false"
      TEST_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run audit:prod
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:content-policy
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
        env:
          NODE_ENV: development
      - run: npm run build
        env:
          NODE_ENV: production
